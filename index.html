<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tank Battle 3D</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070b;
      font-family: "Courier New", Courier, monospace;
      color: #ffe600;
      user-select: none;
    }
    canvas { display: block; }
    #hud {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      pointer-events: none;
      text-shadow: 0 0 6px #ffe600, 2px 2px 0 #7a2e00;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .hud-box {
      background: rgba(0, 0, 0, .42);
      border: 2px solid rgba(255, 230, 0, .75);
      box-shadow: inset 0 0 12px rgba(255, 230, 0, .18), 0 0 10px rgba(0,0,0,.8);
      padding: 7px 10px;
      border-radius: 4px;
      white-space: nowrap;
    }
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      align-items: center;
      justify-content: center;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 2px, transparent 2px 4px),
        rgba(2, 4, 10, .78);
    }
    #overlay.show { display: flex; }
    .card {
      max-width: min(90vw, 680px);
      padding: 34px 42px;
      text-align: center;
      background: linear-gradient(180deg, rgba(20,24,38,.96), rgba(5,8,16,.96));
      border: 5px solid #ffe600;
      border-radius: 8px;
      box-shadow: 0 0 0 4px #7a2e00, 0 0 34px rgba(255,230,0,.32), inset 0 0 28px rgba(255,230,0,.10);
    }
    .card h1 {
      margin: 0 0 14px;
      font-size: clamp(34px, 7vw, 72px);
      line-height: 1;
      color: #ffe600;
      text-shadow: 0 0 10px #ff9d00, 4px 4px 0 #b33c00, 8px 8px 0 rgba(0,0,0,.55);
      letter-spacing: 4px;
    }
    .card h2 {
      margin: 0 0 18px;
      font-size: clamp(18px, 3vw, 28px);
      color: #7df9ff;
      text-shadow: 0 0 8px #0090ff;
      letter-spacing: 2px;
    }
    .card p {
      margin: 8px 0;
      font-size: clamp(13px, 2vw, 17px);
      color: #e8f7ff;
      text-shadow: 0 0 5px rgba(125,249,255,.45);
    }
    .press {
      margin-top: 22px;
      color: #fff;
      animation: blink 1s steps(2, start) infinite;
    }
    .red { color: #ff4d4d; text-shadow: 0 0 10px #ff1a1a; }
    .green { color: #8dff57; text-shadow: 0 0 10px #2dff00; }
    @keyframes blink { 50% { opacity: .15; } }
    #mute {
      position: fixed;
      right: 14px;
      bottom: 12px;
      z-index: 6;
      color: rgba(255,230,0,.75);
      font-size: 12px;
      text-shadow: 0 0 5px #ffe600;
      pointer-events: none;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <div class="hud-box" id="hud-left">LIVES 3</div>
    <div class="hud-box" id="hud-mid">LEVEL 1</div>
    <div class="hud-box" id="hud-right">SCORE 0</div>
  </div>
  <div id="overlay" class="show">
    <div class="card">
      <h1>TANK BATTLE</h1>
      <h2>RETRO 3D ARCADE</h2>
      <p>Defend the eagle base. Destroy every enemy tank.</p>
      <p><span class="green">WASD / ARROWS</span> move &nbsp;•&nbsp; <span class="green">SPACE / J</span> fire</p>
      <p><span class="green">P</span> pause &nbsp;•&nbsp; <span class="green">M</span> mute &nbsp;•&nbsp; <span class="green">ENTER</span> start</p>
      <p class="press">PRESS ENTER TO START</p>
    </div>
  </div>
  <div id="mute">M: SOUND ON</div>

  <script type="module">
    import * as THREE from 'three';

    const TILE = 2.2;
    const MAP_W = 13;
    const MAP_H = 13;
    const WORLD_W = MAP_W * TILE;
    const WORLD_H = MAP_H * TILE;
    const HALF = TILE * 0.31;
    const MAX_LEVEL = 3;

    const hudLeft = document.getElementById('hud-left');
    const hudMid = document.getElementById('hud-mid');
    const hudRight = document.getElementById('hud-right');
    const overlay = document.getElementById('overlay');
    const muteLabel = document.getElementById('mute');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b12);
    scene.fog = new THREE.Fog(0x070b12, 55, 95);

    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 200);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const ambient = new THREE.AmbientLight(0x9db4ff, 0.72);
    scene.add(ambient);
    const sun = new THREE.DirectionalLight(0xffffff, 1.25);
    sun.position.set(-18, 34, 12);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.left = -35;
    sun.shadow.camera.right = 35;
    sun.shadow.camera.top = 35;
    sun.shadow.camera.bottom = -35;
    scene.add(sun);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(WORLD_W + 8, WORLD_H + 8),
      new THREE.MeshStandardMaterial({ color: 0x20301f, roughness: 0.95, metalness: 0.02 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    const gridHelper = new THREE.GridHelper(WORLD_W, MAP_W, 0x4d6b3a, 0x2d4028);
    gridHelper.position.y = 0.015;
    scene.add(gridHelper);

    const brickGeo = new THREE.BoxGeometry(TILE * 0.94, TILE * 0.74, TILE * 0.94);
    const steelGeo = new THREE.BoxGeometry(TILE * 0.96, TILE * 0.82, TILE * 0.96);
    const brickMatA = new THREE.MeshStandardMaterial({ color: 0xb45a22, roughness: 0.88, metalness: 0.03 });
    const brickMatB = new THREE.MeshStandardMaterial({ color: 0x8f3f18, roughness: 0.9, metalness: 0.03 });
    const steelMat = new THREE.MeshStandardMaterial({ color: 0xaeb8c4, roughness: 0.28, metalness: 0.88 });
    const trackMat = new THREE.MeshStandardMaterial({ color: 0x15171c, roughness: 0.72, metalness: 0.25 });
    const barrelMat = new THREE.MeshStandardMaterial({ color: 0x2b2f36, roughness: 0.45, metalness: 0.65 });
    const bulletGeo = new THREE.BoxGeometry(TILE * 0.20, TILE * 0.20, TILE * 0.34);
    const playerBulletMat = new THREE.MeshStandardMaterial({ color: 0xfff36b, emissive: 0xffb400, emissiveIntensity: 0.8 });
    const enemyBulletMat = new THREE.MeshStandardMaterial({ color: 0xff5a4d, emissive: 0xff1400, emissiveIntensity: 0.85 });

    let levelGroup = new THREE.Group();
    let entityGroup = new THREE.Group();
    scene.add(levelGroup, entityGroup);

    const keys = Object.create(null);
    let state = 'menu';
    let level = 1;
    let score = 0;
    let lives = 3;
    let stars = 0;
    let grid = [];
    let eagle = null;
    let player = null;
    let enemies = [];
    let bullets = [];
    let powerups = [];
    let enemyQueue = 0;
    let spawnTimer = 0;
    let freezeTimer = 0;
    let elapsed = 0;
    let muted = false;
    let audioCtx = null;
    let noiseBuffer = null;
    const clock = new THREE.Clock();

    function toWorld(col, row) {
      return {
        x: (col + 0.5) * TILE - WORLD_W / 2,
        z: (row + 0.5) * TILE - WORLD_H / 2
      };
    }

    function cellAt(x, z) {
      const col = Math.floor((x + WORLD_W / 2) / TILE);
      const row = Math.floor((z + WORLD_H / 2) / TILE);
      if (col < 0 || row < 0 || col >= MAP_W || row >= MAP_H) return null;
      return { col, row, ch: grid[row][col] };
    }

    function solidForTank(ch) {
      return ch === 'B' || ch === 'S' || ch === 'E';
    }

    function createLevelGrid(lv) {
      const g = Array.from({ length: MAP_H }, () => Array(MAP_W).fill('.'));
      const set = (c, r, ch) => { if (c >= 0 && r >= 0 && c < MAP_W && r < MAP_H) g[r][c] = ch; };
      const rect = (c, r, w, h, ch) => { for (let y = r; y < r + h; y++) for (let x = c; x < c + w; x++) set(x, y, ch); };

      if (lv === 1) {
        rect(2, 2, 2, 2, 'B'); rect(9, 2, 2, 2, 'B');
        rect(5, 4, 3, 1, 'S');
        rect(1, 5, 2, 3, 'B'); rect(10, 5, 2, 3, 'B');
        rect(4, 7, 2, 2, 'B'); rect(7, 7, 2, 2, 'B');
        rect(2, 9, 3, 1, 'B'); rect(8, 9, 3, 1, 'B');
        rect(0, 11, 2, 1, 'B'); rect(11, 11, 2, 1, 'B');
      } else if (lv === 2) {
        rect(3, 1, 1, 4, 'B'); rect(9, 1, 1, 4, 'B');
        rect(5, 3, 3, 1, 'S');
        rect(1, 4, 4, 1, 'B'); rect(8, 4, 4, 1, 'B');
        rect(5, 6, 3, 2, 'B');
        rect(2, 8, 2, 3, 'S'); rect(9, 8, 2, 3, 'B');
        rect(4, 10, 2, 1, 'B'); rect(7, 10, 2, 1, 'B');
        rect(0, 6, 1, 3, 'B'); rect(12, 6, 1, 3, 'B');
      } else {
        rect(2, 2, 1, 5, 'S'); rect(10, 2, 1, 5, 'S');
        rect(4, 3, 5, 1, 'B'); rect(4, 5, 5, 1, 'B');
        rect(1, 7, 3, 2, 'B'); rect(9, 7, 3, 2, 'B');
        rect(5, 8, 3, 1, 'S');
        rect(3, 10, 2, 1, 'B'); rect(8, 10, 2, 1, 'B');
        rect(0, 3, 2, 2, 'B'); rect(11, 3, 2, 2, 'B');
        rect(5, 1, 3, 1, 'B');
      }

      // Eagle fort, then guarantee clean spawn cells.
      set(5, 10, 'B'); set(6, 10, 'B'); set(7, 10, 'B');
      set(5, 11, 'B'); set(6, 11, 'E'); set(7, 11, 'B');
      set(1, 0, '.'); set(6, 0, '.'); set(11, 0, '.');
      set(6, 12, '.');
      return g;
    }

    function addWall(col, row, ch) {
      const p = toWorld(col, row);
      const mesh = new THREE.Mesh(
        ch === 'S' ? steelGeo : brickGeo,
        ch === 'S' ? steelMat : ((col + row) % 2 ? brickMatA : brickMatB)
      );
      mesh.position.set(p.x, TILE * (ch === 'S' ? 0.41 : 0.37), p.z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData = { type: 'wall', col, row, ch };
      levelGroup.add(mesh);
    }

    function createEagle(col, row) {
      const p = toWorld(col, row);
      const group = new THREE.Group();
      const base = new THREE.Mesh(new THREE.BoxGeometry(TILE * 0.95, TILE * 0.22, TILE * 0.95), new THREE.MeshStandardMaterial({ color: 0x6b4a2a, roughness: 0.8 }));
      const body = new THREE.Mesh(new THREE.CylinderGeometry(TILE * 0.20, TILE * 0.30, TILE * 0.62, 8), new THREE.MeshStandardMaterial({ color: 0xc69a55, roughness: 0.55, metalness: 0.15 }));
      const head = new THREE.Mesh(new THREE.ConeGeometry(TILE * 0.18, TILE * 0.42, 8), new THREE.MeshStandardMaterial({ color: 0xffd76a, roughness: 0.4, metalness: 0.35 }));
      const wingGeo = new THREE.BoxGeometry(TILE * 0.48, TILE * 0.10, TILE * 0.24);
      const wingMat = new THREE.MeshStandardMaterial({ color: 0x9c6b35, roughness: 0.65 });
      const wl = new THREE.Mesh(wingGeo, wingMat);
      const wr = new THREE.Mesh(wingGeo, wingMat);
      base.position.y = TILE * 0.11;
      body.position.y = TILE * 0.53;
      head.position.y = TILE * 0.98;
      wl.position.set(-TILE * 0.34, TILE * 0.66, 0);
      wr.position.set(TILE * 0.34, TILE * 0.66, 0);
      wl.rotation.z = 0.28; wr.rotation.z = -0.28;
      group.add(base, body, head, wl, wr);
      group.position.set(p.x, 0, p.z);
      group.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
      levelGroup.add(group);
      return { col, row, x: p.x, z: p.z, alive: true, mesh: group };
    }

    function createTankMesh(color, isPlayer) {
      const group = new THREE.Group();
      const hullMat = new THREE.MeshStandardMaterial({ color, roughness: 0.48, metalness: 0.38 });
      const turretMat = new THREE.MeshStandardMaterial({ color: new THREE.Color(color).offsetHSL(0, 0.05, isPlayer ? 0.12 : 0.05), roughness: 0.42, metalness: 0.45 });
      const trackGeo = new THREE.BoxGeometry(TILE * 0.24, TILE * 0.42, TILE * 0.94);
      const hullGeo = new THREE.BoxGeometry(TILE * 0.64, TILE * 0.45, TILE * 0.86);
      const turretGeo = new THREE.BoxGeometry(TILE * 0.44, TILE * 0.34, TILE * 0.52);
      const barrelGeo = new THREE.BoxGeometry(TILE * 0.13, TILE * 0.13, TILE * 0.78);

      const lt = new THREE.Mesh(trackGeo, trackMat);
      const rt = new THREE.Mesh(trackGeo, trackMat);
      const hull = new THREE.Mesh(hullGeo, hullMat);
      const turret = new THREE.Mesh(turretGeo, turretMat);
      const barrel = new THREE.Mesh(barrelGeo, barrelMat);
      lt.position.set(-TILE * 0.32, TILE * 0.28, 0);
      rt.position.set(TILE * 0.32, TILE * 0.28, 0);
      hull.position.y = TILE * 0.46;
      turret.position.y = TILE * 0.76;
      barrel.position.set(0, TILE * 0.79, TILE * 0.48);
      group.add(lt, rt, hull, turret, barrel);
      group.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
      return group;
    }

    function makeTank(x, z, dir, color, isPlayer, opts = {}) {
      const mesh = createTankMesh(color, isPlayer);
      entityGroup.add(mesh);
      const tank = {
        mesh, x, z, dir, isPlayer,
        speed: opts.speed || 5.2,
        fireCooldown: opts.fireCooldown || 0,
        decisionTimer: opts.decisionTimer || 0,
        hp: opts.hp || 1,
        alive: true,
        invincible: isPlayer ? 3 : 0,
        half: HALF
      };
      mesh.position.set(x, 0, z);
      mesh.rotation.y = Math.atan2(dir.x, dir.z);
      return tank;
    }

    function createPlayer() {
      const p = toWorld(6, 12);
      return makeTank(p.x, p.z, { x: 0, z: -1 }, 0x2f9dff, true, { speed: 5.6, fireCooldown: 0, invincible: 3 });
    }

    function createEnemy(spawn) {
      const p = toWorld(spawn.col, spawn.row);
      const roll = Math.random();
      let type = 'basic';
      if (level >= 3 && roll < 0.28) type = 'armored';
      else if (level >= 2 && roll < 0.55) type = 'fast';
      const color = type === 'fast' ? 0xff9f1c : type === 'armored' ? 0xb04dff : 0xe33b3b;
      return makeTank(
        p.x, p.z,
        { x: 0, z: 1 },
        color,
        false,
        {
          speed: (type === 'fast' ? 6.4 : 4.15) + level * 0.34 + Math.random() * 0.5,
          fireCooldown: 0.8 + Math.random() * 1.4,
          decisionTimer: Math.random() * 0.7,
          hp: type === 'armored' ? 2 : 1,
          type
        }
      );
    }

    function spawnPoints() {
      return [{ col: 1, row: 0 }, { col: 6, row: 0 }, { col: 11, row: 0 }];
    }

    function allTanks() {
      return player && player.alive ? [player, ...enemies] : enemies;
    }

    function tankCollides(x, z, self) {
      if (x < -WORLD_W / 2 + HALF || x > WORLD_W / 2 - HALF || z < -WORLD_H / 2 + HALF || z > WORLD_H / 2 - HALF) return true;
      const c0 = Math.floor((x - self.half + WORLD_W / 2) / TILE);
      const c1 = Math.floor((x + self.half + WORLD_W / 2) / TILE);
      const r0 = Math.floor((z - self.half + WORLD_H / 2) / TILE);
      const r1 = Math.floor((z + self.half + WORLD_H / 2) / TILE);
      for (let r = r0; r <= r1; r++) {
        for (let c = c0; c <= c1; c++) {
          if (r < 0 || c < 0 || r >= MAP_H || c >= MAP_W) continue;
          if (solidForTank(grid[r][c])) return true;
        }
      }
      for (const t of allTanks()) {
        if (t === self || !t.alive) continue;
        if (Math.abs(x - t.x) < self.half * 2 - 0.04 && Math.abs(z - t.z) < self.half * 2 - 0.04) return true;
      }
      return false;
    }

    function moveTank(tank, dx, dz) {
      const oldX = tank.x, oldZ = tank.z;
      if (dx !== 0) {
        const nx = tank.x + dx;
        if (!tankCollides(nx, tank.z, tank)) tank.x = nx;
      }
      if (dz !== 0) {
        const nz = tank.z + dz;
        if (!tankCollides(tank.x, nz, tank)) tank.z = nz;
      }
      const moved = tank.x !== oldX || tank.z !== oldZ;
      tank.mesh.position.set(tank.x, 0, tank.z);
      tank.mesh.rotation.y = Math.atan2(tank.dir.x, tank.dir.z);
      return moved;
    }

    function randomDir() {
      const dirs = [{ x: 1, z: 0 }, { x: -1, z: 0 }, { x: 0, z: 1 }, { x: 0, z: -1 }];
      return dirs[(Math.random() * dirs.length) | 0];
    }

    function fireBullet(tank) {
      const maxBullets = tank.isPlayer ? 2 + Math.min(stars, 1) : 1;
      const owned = bullets.filter(b => b.alive && b.owner === tank).length;
      if (owned >= maxBullets) return;
      const speed = tank.isPlayer ? 8.2 + stars * 1.15 : 5.0 + level * 0.42;
      const power = tank.isPlayer ? 1 + stars : 1;
      const mesh = new THREE.Mesh(bulletGeo, tank.isPlayer ? playerBulletMat : enemyBulletMat);
      mesh.castShadow = true;
      const bx = tank.x + tank.dir.x * TILE * 0.62;
      const bz = tank.z + tank.dir.z * TILE * 0.62;
      mesh.position.set(bx, TILE * 0.66, bz);
      mesh.rotation.y = Math.atan2(tank.dir.x, tank.dir.z);
      entityGroup.add(mesh);
      bullets.push({ mesh, x: bx, z: bz, dir: { ...tank.dir }, speed, power, owner: tank, alive: true });
      playSound('shoot');
    }

    function destroyCell(col, row) {
      if (grid[row][col] !== 'B') return;
      grid[row][col] = '.';
      const mesh = levelGroup.children.find(m => m.userData && m.userData.type === 'wall' && m.userData.col === col && m.userData.row === row);
      if (mesh) levelGroup.remove(mesh);
      score += 10;
      playSound('hit');
      if (Math.random() < 0.055) spawnPowerup();
      updateHUD();
    }

    function baseHit() {
      if (!eagle || !eagle.alive || state !== 'playing') return;
      eagle.alive = false;
      eagle.mesh.rotation.x = 0.75;
      eagle.mesh.position.y = 0.12;
      playSound('explosion');
      gameOver('THE EAGLE HAS FALLEN');
    }

    function playerHit() {
      if (!player.alive || player.invincible > 0 || state !== 'playing') return;
      lives--;
      playSound('explosion');
      updateHUD();
      if (lives <= 0) {
        player.alive = false;
        player.mesh.visible = false;
        gameOver('ALL TANKS DESTROYED');
      } else {
        const p = toWorld(6, 12);
        player.x = p.x; player.z = p.z;
        player.dir = { x: 0, z: -1 };
        player.alive = true;
        player.invincible = 5;
        player.mesh.visible = true;
        moveTank(player, 0, 0);
      }
    }

    function destroyEnemy(enemy, bulletPower) {
      enemy.alive = false;
      entityGroup.remove(enemy.mesh);
      score += 100 * level + (enemy.hp > 1 ? 80 : 0);
      playSound('explosion');
      if (Math.random() < 0.34) spawnPowerup();
      enemies = enemies.filter(e => e !== enemy);
      updateHUD();
      checkLevelClear();
    }

    function spawnPowerup() {
      for (let i = 0; i < 80; i++) {
        const col = 1 + ((Math.random() * (MAP_W - 2)) | 0);
        const row = 1 + ((Math.random() * (MAP_H - 3)) | 0);
        if (grid[row][col] !== '.') continue;
        const p = toWorld(col, row);
        if (allTanks().some(t => t.alive && Math.hypot(t.x - p.x, t.z - p.z) < TILE)) continue;
        const roll = Math.random();
        const type = roll < 0.40 ? 'star' : roll < 0.70 ? 'helmet' : 'clock';
        let mesh;
        if (type === 'star') {
          mesh = new THREE.Mesh(new THREE.OctahedronGeometry(TILE * 0.30), new THREE.MeshStandardMaterial({ color: 0xfff200, emissive: 0xffaa00, emissiveIntensity: 0.75, roughness: 0.25, metalness: 0.5 }));
        } else if (type === 'helmet') {
          mesh = new THREE.Mesh(new THREE.SphereGeometry(TILE * 0.29, 18, 12), new THREE.MeshStandardMaterial({ color: 0xeaffff, emissive: 0x2288ff, emissiveIntensity: 0.45, roughness: 0.25, metalness: 0.35 }));
        } else {
          mesh = new THREE.Mesh(new THREE.TorusGeometry(TILE * 0.26, TILE * 0.075, 10, 24), new THREE.MeshStandardMaterial({ color: 0x7df9ff, emissive: 0x00d5ff, emissiveIntensity: 0.65, roughness: 0.3, metalness: 0.4 }));
        }
        mesh.position.set(p.x, TILE * 0.55, p.z);
        mesh.castShadow = true;
        entityGroup.add(mesh);
        powerups.push({ mesh, type, x: p.x, z: p.z, life: 15, seed: Math.random() * 10 });
        return;
      }
    }

    function applyPowerup(type) {
      score += 50;
      if (type === 'star') stars = Math.min(3, stars + 1);
      if (type === 'helmet') player.invincible = Math.max(player.invincible, 8);
      if (type === 'clock') freezeTimer = 5;
      playSound('powerup');
      updateHUD();
    }

    function updatePlayer(dt) {
      if (!player.alive) return;
      let dir = null;
      if (keys.KeyA || keys.ArrowLeft) dir = { x: -1, z: 0 };
      else if (keys.KeyD || keys.ArrowRight) dir = { x: 1, z: 0 };
      else if (keys.KeyW || keys.ArrowUp) dir = { x: 0, z: -1 };
      else if (keys.KeyS || keys.ArrowDown) dir = { x: 0, z: 1 };
      if (dir) {
        player.dir = dir;
        moveTank(player, dir.x * player.speed * dt, dir.z * player.speed * dt);
      } else {
        moveTank(player, 0, 0);
      }
      player.fireCooldown -= dt;
      if ((keys.Space || keys.KeyJ) && player.fireCooldown <= 0) {
        fireBullet(player);
        player.fireCooldown = Math.max(0.34 - stars * 0.035, 0.18);
      }
      if (player.invincible > 0) {
        player.invincible -= dt;
        player.mesh.visible = Math.floor(elapsed * 14) % 2 === 0;
        if (player.invincible <= 0) player.mesh.visible = true;
      }
    }

    function alignedWithTarget(enemy, target) {
      const dx = target.x - enemy.x;
      const dz = target.z - enemy.z;
      if (Math.abs(dx) < TILE * 0.42 && enemy.dir.x !== 0 && Math.sign(dx) === enemy.dir.x) return true;
      if (Math.abs(dz) < TILE * 0.42 && enemy.dir.z !== 0 && Math.sign(dz) === enemy.dir.z) return true;
      return false;
    }

    function updateEnemy(enemy, dt) {
      enemy.fireCooldown -= dt;
      enemy.decisionTimer -= dt;

      if (enemy.decisionTimer <= 0) {
        enemy.decisionTimer = 0.55 + Math.random() * 1.25;
        if (Math.random() < 0.48) {
          const target = Math.random() < 0.62 && player.alive ? player : eagle;
          const dx = target.x - enemy.x;
          const dz = target.z - enemy.z;
          if (Math.abs(dx) > Math.abs(dz)) enemy.dir = { x: Math.sign(dx) || 1, z: 0 };
          else enemy.dir = { x: 0, z: Math.sign(dz) || 1 };
        } else {
          enemy.dir = randomDir();
        }
      }

      const moved = moveTank(enemy, enemy.dir.x * enemy.speed * dt, enemy.dir.z * enemy.speed * dt);
      if (!moved) {
        enemy.dir = randomDir();
        enemy.decisionTimer = Math.min(enemy.decisionTimer, 0.18 + Math.random() * 0.35);
      }

      const wantsShot =
        alignedWithTarget(enemy, eagle) ||
        (player.alive && alignedWithTarget(enemy, player)) ||
        Math.random() < 0.16;
      if (enemy.fireCooldown <= 0 && wantsShot) {
        fireBullet(enemy);
        enemy.fireCooldown = Math.max(2.15 - level * 0.22, 0.85) * (0.65 + Math.random() * 0.75);
      }
    }

    function bulletHitsWall(b) {
      const cell = cellAt(b.x, b.z);
      if (!cell) return false;
      const ch = cell.ch;
      if (ch === 'B') {
        destroyCell(cell.col, cell.row);
        return true;
      }
      if (ch === 'S') {
        playSound('hit');
        return true;
      }
      if (ch === 'E') {
        baseHit();
        return true;
      }
      return false;
    }

    function updateBullets(dt) {
      for (const b of bullets) {
        if (!b.alive) continue;
        const dist = b.speed * dt;
        const steps = Math.max(1, Math.ceil(dist / (TILE * 0.45)));
        const sx = b.dir.x * dist / steps;
        const sz = b.dir.z * dist / steps;
        for (let i = 0; i < steps && b.alive; i++) {
          b.x += sx;
          b.z += sz;
          if (b.x < -WORLD_W / 2 || b.x > WORLD_W / 2 || b.z < -WORLD_H / 2 || b.z > WORLD_H / 2) {
            b.alive = false;
            break;
          }
          if (bulletHitsWall(b)) { b.alive = false; break; }

          for (const t of allTanks()) {
            if (!t.alive || t === b.owner) continue;
            const isEnemyBullet = b.owner !== player;
            if (isEnemyBullet && !t.isPlayer) continue;
            if (!isEnemyBullet && t.isPlayer) continue;
            if (Math.abs(b.x - t.x) < HALF + TILE * 0.13 && Math.abs(b.z - t.z) < HALF + TILE * 0.13) {
              b.alive = false;
              if (t.isPlayer) playerHit();
              else {
                t.hp -= b.power;
                if (t.hp <= 0) destroyEnemy(t, b.power);
                else playSound('hit');
              }
              break;
            }
          }
        }
        b.mesh.position.set(b.x, TILE * 0.66, b.z);
      }

      // Enemy and player shots can cancel each other mid-air.
      for (const a of bullets) {
        if (!a.alive) continue;
        for (const c of bullets) {
          if (a === c || !c.alive || a.owner === c.owner) continue;
          if (Math.abs(a.x - c.x) < TILE * 0.24 && Math.abs(a.z - c.z) < TILE * 0.24) {
            a.alive = false;
            c.alive = false;
            playSound('hit');
          }
        }
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        if (!b.alive) {
          entityGroup.remove(b.mesh);
          bullets.splice(i, 1);
        }
      }
    }

    function updatePowerups(dt) {
      for (let i = powerups.length - 1; i >= 0; i--) {
        const p = powerups[i];
        p.life -= dt;
        p.mesh.rotation.y += dt * 3.2;
        p.mesh.position.y = TILE * 0.55 + Math.sin(elapsed * 4 + p.seed) * TILE * 0.10;
        if (p.life <= 0) {
          entityGroup.remove(p.mesh);
          powerups.splice(i, 1);
          continue;
        }
        if (player.alive && Math.hypot(player.x - p.x, player.z - p.z) < TILE * 0.62) {
          applyPowerup(p.type);
          entityGroup.remove(p.mesh);
          powerups.splice(i, 1);
        }
      }
    }

    function updateSpawning(dt) {
      if (enemyQueue <= 0 || enemies.length >= maxAlive()) return;
      spawnTimer -= dt;
      if (spawnTimer > 0) return;
      const options = spawnPoints().filter(s => !allTanks().some(t => t.alive && Math.hypot(t.x - toWorld(s.col, s.row).x, t.z - toWorld(s.col, s.row).z) < TILE));
      if (!options.length) {
        spawnTimer = 0.25;
        return;
      }
      const spawn = options[(Math.random() * options.length) | 0];
      enemies.push(createEnemy(spawn));
      enemyQueue--;
      spawnTimer = Math.max(2.35 - level * 0.24, 1.05);
      playSound('spawn');
      updateHUD();
    }

    function maxAlive() {
      return Math.min(3 + Math.floor((level - 1) / 2), 5);
    }

    function update(dt) {
      elapsed += dt;
      freezeTimer = Math.max(0, freezeTimer - dt);
      updateSpawning(dt);
      updatePlayer(dt);
      if (freezeTimer <= 0) {
        for (const enemy of [...enemies]) updateEnemy(enemy, dt);
      }
      updateBullets(dt);
      updatePowerups(dt);
      updateHUD();
    }

    function checkLevelClear() {
      if (state !== 'playing') return;
      if (enemyQueue === 0 && enemies.length === 0) {
        if (level >= MAX_LEVEL) {
          state = 'victory';
          showOverlay('VICTORY', 'ALL BATTLES WON', 'You are the Battle City champion.');
          playSound('powerup');
        } else {
          state = 'levelclear';
          showOverlay('LEVEL CLEAR', `LEVEL ${level} COMPLETE`, 'Bonus points awarded. Next map is tougher.');
          score += 250 * level;
          playSound('powerup');
          updateHUD();
        }
      }
    }

    function gameOver(reason) {
      if (state === 'gameover') return;
      state = 'gameover';
      showOverlay('GAME OVER', reason, `Final score: ${score}`);
      playSound('gameover');
    }

    function clearEntities() {
      while (entityGroup.children.length) entityGroup.remove(entityGroup.children[0]);
      while (levelGroup.children.length) levelGroup.remove(levelGroup.children[0]);
      bullets = [];
      powerups = [];
      enemies = [];
      eagle = null;
      player = null;
    }

    function buildLevel(lv, resetRun = false) {
      clearEntities();
      level = lv;
      if (resetRun) {
        score = 0;
        lives = 3;
        stars = 0;
      }
      grid = createLevelGrid(lv);
      for (let r = 0; r < MAP_H; r++) {
        for (let c = 0; c < MAP_W; c++) {
          if (grid[r][c] === 'B' || grid[r][c] === 'S') addWall(c, r, grid[r][c]);
        }
      }
      eagle = createEagle(6, 11);
      player = createPlayer();
      enemyQueue = 8 + lv * 4;
      enemies = [];
      bullets = [];
      powerups = [];
      spawnTimer = 1.0;
      freezeTimer = 0;
      player.invincible = 3;
      updateHUD();
    }

    function startGame(lv, resetRun = true) {
      ensureAudio();
      buildLevel(lv, resetRun);
      state = 'playing';
      hideOverlay();
      clock.getDelta();
    }

    function togglePause() {
      if (state === 'playing') {
        state = 'paused';
        showOverlay('PAUSED', 'HALT FIRE', 'Take a breath, commander.');
      } else if (state === 'paused') {
        state = 'playing';
        hideOverlay();
        clock.getDelta();
      }
    }

    function showOverlay(title, subtitle, extra) {
      overlay.innerHTML = `
        <div class="card">
          <h1>${title}</h1>
          <h2>${subtitle}</h2>
          <p>${extra}</p>
          <p class="press">PRESS ENTER</p>
        </div>`;
      overlay.classList.add('show');
    }

    function hideOverlay() {
      overlay.classList.remove('show');
    }

    function updateHUD() {
      const remaining = enemyQueue + enemies.length;
      hudLeft.textContent = `LIVES ${Math.max(lives, 0)}  PWR ${'★'.repeat(stars)}${player && player.invincible > 0 ? ' 🛡' : ''}${freezeTimer > 0 ? ' ❄' + freezeTimer.toFixed(1) : ''}`;
      hudMid.textContent = `LEVEL ${level}  ENEMY ${remaining}`;
      hudRight.textContent = `SCORE ${score}`;
    }

    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const len = audioCtx.sampleRate * 0.5;
        noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const data = noiseBuffer.getChannelData(0);
        for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function tone(freq, dur, type = 'square', vol = 0.08, endFreq = null) {
      if (!audioCtx) return;
      const t = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      if (endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(endFreq, 1), t + dur);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + dur);
    }

    function noise(dur = 0.35, vol = 0.16) {
      if (!audioCtx || !noiseBuffer) return;
      const t = audioCtx.currentTime;
      const src = audioCtx.createBufferSource();
      const gain = audioCtx.createGain();
      const filter = audioCtx.createBiquadFilter();
      src.buffer = noiseBuffer;
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(1800, t);
      filter.frequency.exponentialRampToValueAtTime(120, t + dur);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(filter).connect(gain).connect(audioCtx.destination);
      src.start(t);
      src.stop(t + dur);
    }

    function playSound(name) {
      if (muted) return;
      ensureAudio();
      if (name === 'shoot') tone(760, 0.10, 'square', 0.055, 180);
      if (name === 'hit') tone(220, 0.07, 'sawtooth', 0.045, 90);
      if (name === 'explosion') { noise(0.42, 0.20); tone(120, 0.32, 'triangle', 0.10, 35); }
      if (name === 'powerup') { tone(523, 0.08, 'square', 0.055); setTimeout(() => tone(784, 0.09, 'square', 0.055), 70); setTimeout(() => tone(1046, 0.13, 'square', 0.055), 145); }
      if (name === 'spawn') tone(180, 0.12, 'triangle', 0.045, 360);
      if (name === 'gameover') { tone(392, 0.22, 'sawtooth', 0.08, 196); setTimeout(() => tone(196, 0.34, 'sawtooth', 0.08, 98), 180); }
    }

    function fitCamera() {
      camera.aspect = innerWidth / innerHeight;
      const span = Math.max(WORLD_W, WORLD_H);
      const dist = span * 1.18;
      camera.position.set(0, dist * 1.08, dist * 0.36);
      camera.lookAt(0, 0, 0);
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    }

    addEventListener('resize', fitCamera);
    fitCamera();

    addEventListener('keydown', (e) => {
      const code = e.code;
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(code)) e.preventDefault();
      keys[code] = true;
      ensureAudio();
      if (code === 'KeyM') {
        muted = !muted;
        muteLabel.textContent = muted ? 'M: SOUND OFF' : 'M: SOUND ON';
      }
      if (code === 'KeyP' && (state === 'playing' || state === 'paused')) togglePause();
      if (code === 'Enter') {
        if (state === 'menu' || state === 'gameover' || state === 'victory') startGame(1, true);
        else if (state === 'levelclear') startGame(level + 1, false);
        else if (state === 'paused') togglePause();
      }
      if (state === 'playing' && (code === 'Space' || code === 'KeyJ') && player && player.alive) player.fireCooldown = 0;
    });

    addEventListener('keyup', (e) => { keys[e.code] = false; });
    overlay.addEventListener('click', () => {
      ensureAudio();
      if (state === 'menu' || state === 'gameover' || state === 'victory') startGame(1, true);
      else if (state === 'levelclear') startGame(level + 1, false);
      else if (state === 'paused') togglePause();
    });

    buildLevel(1, true);
    state = 'menu';
    updateHUD();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);
      if (state === 'playing') update(dt);
      else elapsed += dt;
      if (eagle && eagle.alive) eagle.mesh.rotation.y = Math.sin(elapsed * 0.8) * 0.05;
      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
